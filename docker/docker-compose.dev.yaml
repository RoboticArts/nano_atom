services:
  nano-atom:
    extends:
      file: docker-compose.yaml
      service: nano-atom
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nano-atom:build
    volumes:
      - ../:/home/robot/ros2_ws/src/nano_atom:rw
    command: >
      bash -i -c "
        source install/setup.bash
        bash
      "