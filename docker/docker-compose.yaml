services:
  nano-atom:
    image: roboticarts/nano-atom:dev # jazzy-latest
    network_mode: host
    tty: true
    stdin_open: true
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >
      bash -i -c "
        source install/setup.bash &&
        ros2 launch nano_atom_base base.launch.py run_rviz:=true
      "