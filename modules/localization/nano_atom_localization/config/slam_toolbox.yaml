/**:
  slam_toolbox_mapping:
    ros__parameters:

      # Solver
      solver_plugin: solver_plugins::CeresSolver
      ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
      ceres_preconditioner: SCHUR_JACOBI
      ceres_trust_strategy: LEVENBERG_MARQUARDT
      ceres_dogleg_type: TRADITIONAL_DOGLEG
      ceres_loss_function: HuberLoss

      # Interfaces
      map_frame:  map
      odom_frame: robot/odom
      base_frame: robot/base_footprint
      scan_topic: front_laser/scan

      # Timing
      transform_publish_period: 0.02
      map_update_interval: 5.0
      transform_timeout: 0.5
      tf_buffer_duration: 30.0

      # Map & sensor ranges
      resolution: 0.02
      max_laser_range: 7.5
      scan_buffer_maximum_scan_distance: 7.5

      # Scan throttling / debug
      throttle_scans: 1
      debug_logging: true

      # Motion filtering
      minimum_travel_distance: 0.02
      minimum_travel_heading: 0.01
      scan_buffer_size: 10
      min_pass_through: 2
      occupancy_threshold: 0.2

      # Loop closure
      do_loop_closing: true
      loop_search_maximum_distance: 1.5
      loop_search_space_dimension: 3.0
      loop_search_space_resolution: 0.05
      loop_search_space_smear_deviation: 0.03

      # Loop closure thresholds
      link_match_minimum_response_fine: 0.45
      link_scan_maximum_distance: 1.5
      loop_match_minimum_chain_size: 8
      loop_match_maximum_variance_coarse: 2.5
      loop_match_minimum_response_coarse: 0.70
      loop_match_minimum_response_fine: 0.80
      minimum_time_between_loop_closures: 60.0
      optimization_frequency: 1.0  

      # Correlative scan matching
      correlation_search_space_dimension: 0.3
      correlation_search_space_resolution: 0.01
      correlation_search_space_smear_deviation: 0.1

      # Ceres scan matching
      distance_variance_penalty: 0.5
      angle_variance_penalty: 1.0
      fine_search_angle_offset: 0.00349
      coarse_search_angle_offset: 0.349
      coarse_angle_resolution: 0.0349
      minimum_angle_penalty: 0.9
      minimum_distance_penalty: 0.5
      use_response_expansion: true

